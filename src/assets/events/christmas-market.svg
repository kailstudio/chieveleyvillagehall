<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Christmas market & tree lighting: dusk, a lit tree, two stalls, falling snow. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8fc0"/>
      <stop offset=".45" stop-color="#b9acd3"/>
      <stop offset=".72" stop-color="#efc6bd"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4eef0"/>
      <stop offset="1" stop-color="#cfc8de"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5d7d4f"/>
      <stop offset="1" stop-color="#2c3d2c"/>
    </linearGradient>
    <linearGradient id="stall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6936a"/>
      <stop offset="1" stop-color="#9c5c44"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffb37a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset=".35" stop-color="#ffd48a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .16"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#sky)"/>
  <!-- distant trees, out of focus -->
  <g filter="url(#soft)" fill="#4f6a55" opacity=".75">
    <circle cx="40" cy="390" r="70"/><circle cx="120" cy="370" r="60"/><circle cx="520" cy="385" r="75"/><circle cx="600" cy="360" r="70"/>
    <circle cx="300" cy="400" r="55"/>
  </g>
  <!-- warm glow behind the tree -->
  <circle cx="390" cy="330" r="200" fill="url(#warm)" opacity=".55"/>
  <!-- snowy ground -->
  <path d="M0 430 C 150 405 420 410 600 438 L 600 600 L 0 600 Z" fill="url(#ground)"/>
  <ellipse cx="392" cy="468" rx="120" ry="18" fill="#b9b0cf" opacity=".5" filter="url(#haze)"/>

  <!-- market stalls -->
  <g>
    <rect x="70" y="380" width="120" height="86" rx="6" fill="url(#stall)"/>
    <rect x="86" y="404" width="88" height="44" rx="4" fill="#ffd394"/>
    <rect x="86" y="404" width="88" height="44" rx="4" fill="url(#light)" opacity=".9"/>
    <path d="M58 386 L130 336 L202 386 Z" fill="#f6f0ee"/>
    <rect x="182" y="404" width="96" height="70" rx="6" fill="url(#stall)" opacity=".92"/>
    <rect x="195" y="424" width="70" height="34" rx="4" fill="#ffcf8c"/>
    <path d="M172 410 L230 370 L288 410 Z" fill="#efe8ec"/>
    <circle cx="130" cy="426" r="60" fill="url(#light)" opacity=".55"/>
  </g>

  <!-- the tree -->
  <g>
    <rect x="384" y="430" width="18" height="40" rx="4" fill="#4a3428"/>
    <path d="M393 140 C 380 190 350 230 318 262 C 342 264 356 262 366 258 C 340 300 306 336 270 362 C 300 368 330 364 352 356 C 322 396 284 424 246 444 C 300 452 360 452 393 452 C 426 452 486 452 540 444 C 502 424 464 396 434 356 C 456 364 486 368 516 362 C 480 336 446 300 420 258 C 430 262 444 264 468 262 C 436 230 406 190 393 140 Z" fill="url(#tree)"/>
    <!-- lights -->
    <g fill="url(#light)">
      <circle cx="372" cy="232" r="13"/><circle cx="414" cy="250" r="12"/><circle cx="350" cy="300" r="13"/>
      <circle cx="396" cy="292" r="14"/><circle cx="442" cy="318" r="13"/><circle cx="318" cy="368" r="13"/>
      <circle cx="372" cy="356" r="14"/><circle cx="426" cy="380" r="14"/><circle cx="478" cy="398" r="13"/>
      <circle cx="292" cy="428" r="12"/><circle cx="350" cy="420" r="14"/><circle cx="410" cy="432" r="13"/><circle cx="470" cy="436" r="12"/>
    </g>
    <circle cx="393" cy="132" r="46" fill="url(#light)"/>
    <path d="M393 112 L399 128 L416 128 L402 138 L407 154 L393 144 L379 154 L384 138 L370 128 L387 128 Z" fill="#fff4d6"/>
  </g>

  <!-- falling snow -->
  <g fill="#ffffff">
    <g opacity=".85">
      <circle cx="60" cy="90" r="3.5"/><circle cx="150" cy="160" r="2.5"/><circle cx="230" cy="70" r="3"/><circle cx="290" cy="190" r="2.5"/>
      <circle cx="520" cy="120" r="3.5"/><circle cx="560" cy="230" r="2.5"/><circle cx="470" cy="60" r="2.5"/><circle cx="110" cy="270" r="3"/>
      <circle cx="250" cy="300" r="2.5"/><circle cx="540" cy="320" r="3"/><circle cx="200" cy="230" r="2"/><circle cx="330" cy="90" r="2"/>
    </g>
    <g opacity=".55" filter="url(#haze)">
      <circle cx="90" cy="200" r="6"/><circle cx="270" cy="120" r="5"/><circle cx="500" cy="250" r="6"/><circle cx="570" cy="80" r="5"/><circle cx="30" cy="320" r="5"/>
    </g>
  </g>
  <rect width="600" height="600" filter="url(#grain)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
