<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- AGM & Trustees meeting: a quiet room, a long table with chairs, light from a tall window. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9d3e8"/><stop offset="1" stop-color="#ece5ec"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b48a"/><stop offset="1" stop-color="#c58d61"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b8c40"/><stop offset="1" stop-color="#3e5426"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb878"/><stop offset="1" stop-color="#799851"/>
    </linearGradient>
    <linearGradient id="chair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5470"/><stop offset="1" stop-color="#3b3750"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ee" stop-opacity=".85"/><stop offset="1" stop-color="#fff2e2" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="beamBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="haze" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .15"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#wall)"/>
  <!-- tall windows and soft pillars -->
  <g filter="url(#haze)">
    <rect x="70" y="60" width="110" height="300" rx="55" fill="#f8f3f1"/>
    <rect x="420" y="60" width="110" height="300" rx="55" fill="#f8f3f1"/>
    <rect x="236" y="30" width="128" height="330" fill="#cfc7df" opacity=".55"/>
  </g>
  <!-- outside green through the windows -->
  <g filter="url(#soft)" opacity=".7">
    <circle cx="110" cy="300" r="46" fill="#8fae86"/><circle cx="160" cy="320" r="40" fill="#9fb878"/>
    <circle cx="470" cy="300" r="44" fill="#8fae86"/><circle cx="510" cy="324" r="38" fill="#a8c08e"/>
  </g>
  <!-- floor -->
  <path d="M0 372 L 600 372 L 600 600 L 0 600 Z" fill="url(#floor)"/>
  <rect x="0" y="366" width="600" height="10" fill="#bba9c6" opacity=".6"/>
  <!-- light beam across the floor -->
  <path d="M430 80 L 540 80 L 620 470 L 620 620 L 300 620 Z" fill="url(#beam)" opacity=".5" filter="url(#beamBlur)"/>
  <path d="M40 390 L 280 390 L 360 620 L -20 620 Z" fill="#fff3e4" opacity=".16" filter="url(#beamBlur)"/>

  <!-- chairs behind the table -->
  <g fill="url(#chair)">
    <rect x="132" y="300" width="62" height="110" rx="22"/>
    <rect x="222" y="300" width="62" height="110" rx="22"/>
    <rect x="312" y="300" width="62" height="110" rx="22"/>
    <rect x="402" y="300" width="62" height="110" rx="22"/>
  </g>
  <!-- the table -->
  <ellipse cx="300" cy="520" rx="230" ry="20" fill="#8a5e3f" opacity=".35" filter="url(#soft)"/>
  <rect x="94" y="398" width="412" height="26" rx="13" fill="url(#top)"/>
  <rect x="112" y="420" width="376" height="62" rx="10" fill="url(#table)"/>
  <rect x="130" y="478" width="18" height="40" rx="6" fill="#33461f"/>
  <rect x="452" y="478" width="18" height="40" rx="6" fill="#33461f"/>
  <!-- papers, a jug and two glasses -->
  <g>
    <rect x="160" y="394" width="58" height="10" rx="3" fill="#fbf8f2" transform="rotate(-4 189 399)"/>
    <rect x="252" y="395" width="52" height="9" rx="3" fill="#fbf8f2" transform="rotate(3 278 400)"/>
    <rect x="380" y="394" width="56" height="10" rx="3" fill="#fbf8f2" transform="rotate(-2 408 399)"/>
    <path d="M330 352 C 330 344 356 344 356 352 L 360 402 C 360 410 326 410 326 402 Z" fill="#eef3f6" opacity=".9"/>
    <path d="M356 362 C 368 364 368 384 358 386" fill="none" stroke="#eef3f6" stroke-width="5" opacity=".9"/>
    <rect x="232" y="374" width="16" height="28" rx="4" fill="#f4f7f8" opacity=".85"/>
    <rect x="452" y="374" width="16" height="28" rx="4" fill="#f4f7f8" opacity=".85"/>
  </g>
  <rect width="600" height="600" filter="url(#grain)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
