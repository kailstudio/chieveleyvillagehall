<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Bonfire & fireworks: dusk sky, three soft bursts, hills and a bonfire. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3157"/>
      <stop offset=".5" stop-color="#5e4c78"/>
      <stop offset=".78" stop-color="#c88b86"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5f57"/><stop offset="1" stop-color="#34433a"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34482f"/><stop offset="1" stop-color="#1f2b1c"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a3d"/><stop offset=".6" stop-color="#ffb05a"/><stop offset="1" stop-color="#ffe3a0"/>
    </linearGradient>
    <radialGradient id="fireGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb46e" stop-opacity=".85"/><stop offset="1" stop-color="#ff8a4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="burstGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0d6" stop-opacity=".7"/><stop offset="1" stop-color="#ffc79a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer>
    </filter>
    <!-- one burst: 16 rays, each a short line from r 22 to r 70 -->
    <g id="burst" stroke-linecap="round" stroke-width="6">
      <g id="ray4">
        <line x1="0" y1="-24" x2="0" y2="-74"/><line x1="0" y1="24" x2="0" y2="74"/>
        <line x1="-24" y1="0" x2="-74" y2="0"/><line x1="24" y1="0" x2="74" y2="0"/>
      </g>
      <use href="#ray4" transform="rotate(22.5)"/><use href="#ray4" transform="rotate(45)"/><use href="#ray4" transform="rotate(67.5)"/>
    </g>
  </defs>

  <rect width="600" height="600" fill="url(#sky)"/>

  <!-- bursts -->
  <circle cx="190" cy="170" r="110" fill="url(#burstGlow)"/>
  <circle cx="420" cy="120" r="90" fill="url(#burstGlow)"/>
  <circle cx="470" cy="290" r="70" fill="url(#burstGlow)" opacity=".7"/>
  <g filter="url(#glow)">
    <use href="#burst" transform="translate(190 170) scale(1.15)" stroke="#ffc9a3"/>
    <use href="#burst" transform="translate(420 120) scale(.9) rotate(11)" stroke="#f6b3cf"/>
    <use href="#burst" transform="translate(470 290) scale(.6)" stroke="#ffe0a0"/>
  </g>
  <g fill="#fff3dc">
    <circle cx="190" cy="170" r="7"/><circle cx="420" cy="120" r="6"/><circle cx="470" cy="290" r="5"/>
  </g>
  <!-- a falling trail -->
  <g fill="#ffd9b0" opacity=".8">
    <circle cx="300" cy="230" r="3"/><circle cx="304" cy="252" r="2.5"/><circle cx="310" cy="272" r="2"/><circle cx="318" cy="290" r="1.6"/>
  </g>

  <!-- hills -->
  <path d="M0 400 C 120 350 230 360 330 392 C 430 420 520 360 600 372 L 600 600 L 0 600 Z" fill="url(#hillBack)" filter="url(#soft)" opacity=".95"/>
  <path d="M0 460 C 140 420 300 430 420 452 C 500 466 560 450 600 440 L 600 600 L 0 600 Z" fill="url(#hillFront)"/>

  <!-- bonfire -->
  <circle cx="250" cy="452" r="150" fill="url(#fireGlow)" opacity=".75"/>
  <ellipse cx="250" cy="488" rx="90" ry="14" fill="#ffb27a" opacity=".35" filter="url(#soft)"/>
  <g>
    <rect x="196" y="470" width="110" height="16" rx="8" fill="#4a3226" transform="rotate(-14 251 478)"/>
    <rect x="196" y="470" width="110" height="16" rx="8" fill="#3b271e" transform="rotate(14 251 478)"/>
    <path d="M250 330 C 278 380 300 410 300 440 C 300 468 278 482 250 482 C 222 482 200 468 200 440 C 200 412 226 392 236 368 C 240 392 250 400 256 404 C 262 380 258 356 250 330 Z" fill="url(#flame)"/>
    <path d="M252 400 C 266 420 274 436 274 450 C 274 466 264 474 252 474 C 238 474 228 466 228 450 C 228 434 240 428 244 414 C 248 428 252 430 254 432 C 256 422 256 412 252 400 Z" fill="#ffe7ad"/>
  </g>
  <!-- sparks -->
  <g fill="#ffd28f">
    <circle cx="230" cy="312" r="3"/><circle cx="276" cy="296" r="2.5"/><circle cx="258" cy="268" r="2"/><circle cx="212" cy="282" r="2"/><circle cx="292" cy="330" r="2.5"/>
  </g>
  <rect width="600" height="600" filter="url(#grain)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
